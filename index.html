<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Breaking Battles</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            background-color: #2d2d2d;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lives-display {
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .timer {
            font-size: 1.5rem;
            font-family: monospace;
            color: #ffa502;
            min-width: 120px;
            text-align: center;
        }

        .class-indicator {
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px #00cec9, 0 0 30px #ff0080;
            text-align: center;
        }

        p.subtitle {
            color: #bdc3c7;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .class-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            max-width: 600px;
            width: 90%;
        }

        .class-card {
            background: #333;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .class-card:hover {
            transform: translateY(-5px);
            background: #444;
        }

        .class-card.selected {
            border-color: white;
            box-shadow: 0 0 15px currentColor;
        }

        .class-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .class-desc {
            font-size: 0.8rem;
            color: #aaa;
        }

        button#btn-play {
            padding: 15px 50px;
            font-size: 1.3rem;
            cursor: pointer;
            background: linear-gradient(45deg, #00cec9, #0984e3);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 206, 201, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button#btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 206, 201, 0.6);
        }

        #status-message {
            margin-top: 20px;
            height: 20px;
            color: #ffeaa7;
            font-style: italic;
            font-size: 1.1rem;
        }

        .hidden {
            display: none !important;
        }

        /* Mensajes Centrales */
        #center-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px black;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Capa de Interfaz -->
        <div id="ui-layer">
            <div class="top-bar">
                <div class="lives-display">Vidas: <span id="my-lives">❤️❤️❤️</span></div>
                <div class="timer" id="race-timer">00:00.00</div>
                <div class="class-indicator" id="my-class-badge">CLASE</div>
            </div>
            
            <!-- Mensajes centrales (Ganaste/Perdiste) -->
            <div id="center-msg"></div>
        </div>

        <!-- Menú Principal / Lobby -->
        <div id="menu-screen">
            <h1>Block Breaking<br>Battles</h1>
            <p class="subtitle">Rompe bloques. Cruza la meta. Sobrevive.</p>
            
            <div class="class-selector" id="class-list">
                <!-- Se llenará dinámicamente via JS -->
            </div>

            <button id="btn-play">Buscar Partida Rápida</button>
            <div id="status-message"></div>
        </div>
    </div>

    <!-- Librería Socket.io CDN -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Nuestro Lógica de Juego -->
    <script src="game.js"></script>
</body>
</html>
